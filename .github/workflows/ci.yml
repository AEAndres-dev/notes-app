name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# ==========================================================================
# Pipeline: migration-safety -> 89-case regression -> suggest-contract ->
#   reduced-motion -> staging deploy
# Gates read from the source of truth (notes-app-proposal-v3.md + task-12..17),
# not from ad-hoc rules.
# ==========================================================================

jobs:
  # 1) Migration-safety CI: old-schema fixture → new loader, zero data loss,
  #    idempotent upgrade, plain-language errors.
  migration-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run migration-safety fixture tests
        run: python -m pytest tests/test_migration_safety.py --cov=src --cov-branch

  # 2) 89-case regression guard: full suite still passes after src/ changes;
  #    CLI prints ISO YYYY-MM-DD; undated notes sort last in Today/Upcoming.
  regression-guard:
    needs: migration-safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run full 89-test regression suite
        run: python -m pytest --cov=src --cov-branch --cov-report=term-missing

  # 3) Suggest-contract test: endpoint shape frozen; dedup + case-insensitive
  #    prefix + sorted + capped at 10; highlight wraps matched prefix in <mark>;
  #    no-q → 400.
  suggest-contract:
    needs: regression-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run suggest-endpoint contract tests
        run: python -m pytest tests/test_suggest_contract.py --cov=src --cov-branch

  # 4) Reduced-motion gateway: all animation durations and CSS var flips collapse
  #    to 0ms under @media (prefers-reduced-motion: reduce).
  reduced-motion:
    needs: suggest-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run reduced-motion regression tests
        run: python -m pytest tests/test_reduced_motion.py --cov=src --cov-branch

  # 5) On main push only (not PR), build + deploy staging and post URL.
  deploy-staging:
    needs: reduced-motion
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build + deploy staging
        run: echo "Staging environment live at https://staging-pr14.dev"